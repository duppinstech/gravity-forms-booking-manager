name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax check
        run: |
          find . -name '*.php' -not -path './release/*' -print0 | xargs -0 -n1 php -l
      - name: Slot tests
        run: php tests/run.php
      - name: Release notes for the current version
        if: matrix.php == '8.2'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' gravity-forms-booking-manager.php | tr -d '\r')
          bash .claude/scripts/release-notes.sh "$version" gravity-forms-booking-manager.php "$RUNNER_TEMP/release-notes.md"
